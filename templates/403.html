{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 – Access Forbidden | Restaurant Manager</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:wght@400;600&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background: #faf9f7; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .error-card { background: #fff; border-radius: 16px; padding: 3rem 2.5rem; max-width: 480px; text-align: center; box-shadow: 0 4px 32px rgba(0,0,0,0.07); }
        .error-code { font-family: 'Playfair Display', serif; font-size: 5rem; font-weight: 700; color: #e07b39; line-height: 1; margin-bottom: 0.5rem; }
        .error-title { font-size: 1.4rem; font-weight: 600; color: #1a1a1a; margin-bottom: 1rem; }
        .error-msg { color: #666; line-height: 1.6; margin-bottom: 2rem; }
        .btn-home { background: #e07b39; color: #fff; border: none; padding: 0.65rem 2rem; border-radius: 8px; font-size: 0.95rem; font-weight: 500; text-decoration: none; display: inline-block; transition: background 0.2s; }
        .btn-home:hover { background: #c96a28; color: #fff; }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="error-code">403</div>
        <div class="error-title">Access Forbidden</div>
        <p class="error-msg">You don't have permission to access this page. Please contact your manager if you think this is a mistake.</p>
        <a href="/" class="btn-home">Back to Home</a>
    </div>
</body>
</html>
